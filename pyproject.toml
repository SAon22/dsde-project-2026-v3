[project]
name = "cctv"
version = "0.1.0"
description = "Bangkok CCTV image analysis pipeline (2110403 DSDE project)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
